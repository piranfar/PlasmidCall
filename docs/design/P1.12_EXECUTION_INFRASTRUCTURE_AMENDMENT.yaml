# ---------------------------------------------------------------------------- measured basis

measured_workload:
  source: retained P1.10 and P1.9C4 receipts, not estimates
  assembly:
    cohort_measured: P1.10, 39 isolates
    per_isolate_median_min: 35.3
    per_isolate_mean_min: 47.6
    per_isolate_max_min: 235.8
    total_slot_hours_measured: 30.9
    projected_slot_hours_for_79: 62.7
    container_limits: "--cpus=8 --memory=12g"
    retained_scratch_gb_median: 0.1
    scratch_caveat: >
      0.1 GB is the RETAINED scratch after --keep 1. PEAK intermediate usage during the SPAdes
      phase was never measured and is materially larger. Disk headroom is sized conservatively.
  inference:
    cohort_measured: P1.9C4 receipts, 8 samples, 13 tools
    per_sample_all_tools_min: 15.5
    projected_slot_hours_for_79: 20.4
    slowest_tools: [plasmer 216s, genomad 145s, plasme 142s, plasmidec 103s, gplas2 96s]
    container_limits: "--cpus=8, --memory up to 24g (plascope observed)"
    caveat: >
      timings come from the P1.9C4 benchmark samples, not from P1.10. Per-sample tool cost should
      be comparable but is indicative rather than exact.
  fixed_overhead_hours: 5
  fixed_overhead_components:
    preflight_and_identity_verification: 0.5
    acquisition_31_6_gb: 1.5
    truth_generation: 2.0
    evaluation_freeze_transfer: 1.0
  estimate_uncertainty: >
    Assembly time scales with read volume. P1.11 carries 67.9 Gbase over 79 isolates (mean 859
