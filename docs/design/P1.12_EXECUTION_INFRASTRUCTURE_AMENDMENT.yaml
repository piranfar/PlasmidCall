amendment: P1.11 execution infrastructure - host resize and revised parallelism
version: "1.0-DRAFT"
status: PROPOSED - AWAITING SIZE DECISION AND OWNER-EXECUTED RESIZE
declared_on: 2026-08-20
scope: EXECUTION ONLY

# ---------------------------------------------------------------------------- scope guard

what_this_amendment_changes:
  - the number of concurrent INDEPENDENT samples processed at once
  - the host shape (OCPU and memory) of the existing instance

what_this_amendment_does_NOT_change:
  - per-sample scientific commands
  - tool parameters, container CPU limits, container memory limits
  - the frozen Product A protocol (unicycler -1 R1 -2 R2 -o /tmp/a -t 8 --keep 1)
  - model thresholds (v1.2-General 0.9285; v1.1 0.9524 / 0.9605)
  - cohort membership (the sealed 79 isolates)
  - endpoint definitions, the completeness gate, or any evaluation rule
  - images, databases, parsers, or any frozen provenance
invariance_statement: >
  Scientific methods, cohort membership and evaluation rules are unchanged. Only the number of
  independent samples running concurrently changes. Each sample is still processed by exactly the
  same command with exactly the same per-container CPU and memory limits it would have received on
  the current host.

# ---------------------------------------------------------------------------- current state

