# ---------------------------------------------------------------------------- verification

independent_verification:
  receipt: docs/evidence/P1.11_INDEPENDENT_RECOVERY_VERIFICATION.json
  verdict: ALL_PASS
  n_examined: 49
  n_recovered: 47
  n_correctly_not_recovered: 2
  independence: >-
    The verifier did NOT re-run the frozen parse_mobsuite to reach its decision. It derived every
    call from FASTA RECORD MEMBERSHIP in mob/chromosome.fasta and mob/plasmid_*.fasta, rebuilt the
    assembly universe by MEASURING sequence lengths rather than trusting header length= tokens,
    and applied its own required-file rule, its own 24-column schema validation and its own
    two-directional contig reconciliation. Only after its verdicts were fixed did it import the
    frozen parser as a third opinion.
  three_way_agreement:
    derivations: [FASTA record membership, contig_report molecule_type column, frozen parse_mobsuite]
    contigs_compared: 11241
    disagreements: 0
  totals_across_the_47:
    assembled_contigs: 11241
    eligible_ge_1kb: 4763
    total_bp: 236934939
    calls: {chromosome: 10353, plasmid: 888, unknown: 0}
    contig_reconciliation: parsed == assembled in 47 of 47, both directions
  positive_control:
    units: the 30 mobsuite units that already carried receipt status OK
    contigs: 6930
    problems: 0
    cross_check_disagreements: 0
    purpose: shows the checker does not simply pass whatever it is shown
  root_cause_corroborated_isolate_by_isolate: >-
    In 47 of 47, the mob_recon output and the .done marker have mtimes PRECEDING the start_utc of
    the failing receipt; the failing attempt lasted 1-3 seconds; and its log ends
    "mob_suite.mob_recon ERROR: Error output directory exists, please specify a new directory or
    use --force to overwrite". The blocked attempt aborted BEFORE touching the pre-existing output.
    This is direct causal evidence, not inference from the exit code alone.

  negative_control_finding: >-
    IMPORTANT. Both genuine .failed isolates leave residual output that the frozen parser parses
    WITHOUT raising - 115 and 82 contigs, 0 unknown. Trusting "the output parses" alone would have
    wrongly recovered both. They are excluded by the marker gate (rule 2) and, independently, by
    the required-file and leftover-__tmp checks. Rule 2 is therefore load-bearing rather than
    merely conservative, and its two genuine failures carry exit_code 1 with a pandas
    "No objects to concatenate" traceback - a real mid-pipeline abort, not the 255 clobber
    signature.

router_effect_clarification:
  statement: >-
    Router route-selection states changed on 0 contigs; routed Boolean outputs changed on 247
    contigs because corrected MOB-recon evidence changed model scores.
  explanation: >-
    The router's ROUTE SELECTION depends on annotation state and ARG-bearing status, neither of
    which this correction touched, so no contig changed which model scored it. What changed is the
    SCORE that the already-selected model produced, and therefore the Boolean output at the locked
    operating points.

truth_access_statement: >-
  P1.11 truth has not been acquired, constructed, or accessed by the evaluation workflow. The claim
  is about what the P1.11 prediction workflow consumed before freeze; it is not a claim that
  reference-related files cannot exist elsewhere on the host. Prior-phase P1.10 and P1.9C3 truth
  artefacts do exist on the shared volume and were never read by any P1.11 step.

# ---------------------------------------------------------------------------- immutability

original_evidence_is_immutable:
  statement: >-
    The original receipts remain IMMUTABLE HISTORICAL EVIDENCE. No receipt, terminal marker,
    attempt log or tool output was overwritten, deleted, edited or moved by this correction. The
    stale FAILED/255 receipts are retained exactly as written, and remain the record of what the
    later blocked attempt reported.
  what_the_correction_does: >-
    It adds a DERIVED provenance state computed from those immutable artefacts. The derivation is
    recorded in a separate reconciliation receipt; the inputs are untouched.
  superseded_parse_step: >-
    env/run/parse_all.py is PRESERVED UNCHANGED. A superseding step consumes the reconciliation
    receipt and re-emits the normalised call table; the original call table is retained and marked
    invalid rather than deleted.

# ---------------------------------------------------------------------------- invalidated

superseded_candidates:
  - artefact: candidate contig table built from native_call
    sha256: f0c273e6f5c89702d9e5333a0b5a4629b647002e4db47caf5267a1aea7ae3545
    manifest_sha256: 311c125a27729c4da30990f8af15b89773b8bb8e0f7fda0f2a670dd0962cab5d
    status: INVALID_SUPERSEDED_DO_NOT_USE
    reason: >-
      the builder read native_call, the RAW per-tool vocabulary, instead of model1_code, the
      normalised 7-term code the encoder consumes. Only 3 of ~130 native values coincide with the
      vocabulary, so most tool evidence reached the model as unrecognised tokens and was absorbed
      by direct-block neutrality. v1.2 positives read 196 against 808 with the correct column.
  - artefact: candidate contig table built before stale-receipt reconciliation
    sha256: b297134f92026414e929dbaa3b062b14c4137233aa0ebed3d992a0f2730a1580
    manifest_sha256: bff98be97418196b401db643f07885c1d4f3ea7a175987dca6461791d551b455
    status: INVALID_SUPERSEDED_DO_NOT_USE
    reason: >-
      correct call column, but built while 47 isolates' valid MOB-recon evidence was still being
      discarded by stale receipts. MOB-recon availability read 0.3534 instead of its true value.

superseded_candidates_prohibition: >-
  Neither artefact may appear in manuscript tables, evaluation results, or the final evidence
  package, except within this corrective audit trail.

builder_vocabulary_guarantee:
  reads_only: model1_code
  constant: CALL_COLUMN = "model1_code" in scripts/p1_12/build_p111_contig_table.py
  fail_loud_validation:
    - load_calls refuses if the model1_code column is absent
    - load_calls refuses if any value falls outside the frozen 7-term vocabulary
    - a builder validation check asserts every emitted panel call is within the vocabulary
    - a fixture fills native_call with an out-of-vocabulary token so a regression to the wrong
      column fails loudly
