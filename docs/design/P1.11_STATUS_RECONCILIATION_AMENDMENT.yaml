# ---------------------------------------------------------------------------- the incident

incident:
  what_happened: >-
    Earlier in the P1.11 run, before the single-instance flock was in place, up to 14 concurrent
    inference loops raced on the same tool/sample pairs. The frozen runner ends a successful run
    with `chmod -R a-w $OUT`, and tools write inside the container as root. A second loop reaching
    an already-completed pair could therefore neither clear nor rewrite the output directory and
    exited 255. That later failed attempt OVERWROTE the receipt of the earlier successful run,
    while the .done terminal marker from the successful run survived.
  signature: exit_code 255 with a .done marker and complete output present
  prior_record: docs/evidence/P1.11_ACQUISITION_CORRECTION_RECORD.md documents the same
    concurrency class of defect; the flock fix is in scripts/p1_12/p111_infer.sh
  how_it_surfaced: >-
    Tool-evidence completeness for MOB-recon read 0.3534 while its terminal markers read 77 done /
    2 failed. The two could not both be true, which forced the investigation.

conflict_observed:
  terminal_marker: .done (from the successful run)
  receipt: status FAILED, exit_code 255 (written by a later blocked attempt)
  native_output: present, complete and parseable by the frozen parser
  consequence_if_uncorrected: >-
    parse_all.py:25-28 reads the RECEIPT status and, when it is not OK, codes every contig of that
    isolate FAILED. Valid MOB-recon evidence for 47 of 79 isolates was therefore discarded.

