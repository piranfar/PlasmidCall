# ---------------------------------------------------------------------------- the rule

reconciliation_hierarchy:
  scope: audited across ALL 1027 execution units, every tool, not only MOB-recon
  rules:
    - id: 1
      rule: exactly one terminal marker must exist, .done or .failed
      violation_behaviour: FAILED (fail closed)
    - id: 2
      rule: >-
        if .failed exists, the effective execution state remains FAILED, even if residual or
        partial output can be parsed
    - id: 3
      rule: if .done exists and the receipt also reports success, process normally as OK
    - id: 4
      rule: >-
        if .done exists but the receipt reports failure, verify the required output-file set,
        verify files are non-empty where required, run tool-specific structural/schema validation,
        verify contig reconciliation, and parse the output successfully. If EVERY check passes,
        assign the derived provenance state RECOVERED_OK; otherwise fail closed as FAILED.
    - id: 5
      rule: >-
        RECOVERED_OK contributes its parsed biological calls to model1_code while remaining
        distinguishable from ordinary OK in provenance and reporting
    - id: 6
      rule: a .failed execution is NEVER converted to RECOVERED_OK
  tool_specific_structural_validation: >-
    the frozen parser in env/run/parsers.py is the structural/schema validator - it raises
    ParseError on malformed or absent mandatory output - and contig reconciliation requires the
    parsed contig set to equal the assembled contig set exactly.
  inputs_forbidden_to_the_rule:
    - prediction scores
    - truth labels
    - expected class distributions
    - downstream performance of any kind

