corrected_preflight_pass_requires:
  - 13/13 image IDs match the P1.10 as-executed gate
  - 9/9 retained external database archives match the P1.9C4 DB_RECEIPTS sha256
  - every embedded-database tool has its image verified and its init/install receipt present
  - 19/19 P1.10 as-executed environment files match
  - derived P1.11 runner and parser hashes match the newly frozen receipt
  - all 13 scientific CMD strings byte-identical after path normalisation
  - PlaScope functional replay passes
  - 13/13 tools complete the consumed-sample truth-blind smoke test
  - 3636/3636 parsed calls reproduce P1.10 exactly
  - the fixture suite passes completely

fixture_coverage_required:
  - all external-database tools present
  - one required external database missing
  - embedded-database tools with no external directory
  - image-ID mismatch
  - runner-command mismatch
  - parser mismatch
  - wrong environment path
  - PlaScope replay match
  - PlaScope replay mismatch
  - missing prior baseline
  - derived runner containing a scientific-command change

ordering: >
  This correction, the superseding implementation, the derived runner and parser, the fixture
  outputs and the successful preflight receipt are all produced and hashed BEFORE any P1.11 read is
  acquired.
