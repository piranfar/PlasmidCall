version: '1.0'
date_utc: '2026-08-19'
authorisation: 'Owner: Option A approved (2026-08-19) — full 12-tool inference for Model 1 on the existing OCI instance/volume; no new OCI resources'

preserved_frozen_hashes_unchanged:
  truth_bundle_FROZEN: 'c2c7a1aa4e49a6d47dd2ea10d808bf7fa09ea52155604541a6e7919fb9c90eda'
  truth_ratification_amendment: 'b3a57a545d9378f69563815d2196a9a7d47e71d6ed35eee0a636b914a20d5605'
  truth_execution_amendment: 'dea4c51dc263abdfa3a4ec6024eb07bf37399d0fec520f64b0198f29312db727'
