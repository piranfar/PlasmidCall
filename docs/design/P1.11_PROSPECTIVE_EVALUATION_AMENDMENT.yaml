# ---------------------------------------------------------------------------- projections

projected_power:
  status: PLANNING ESTIMATE ONLY - not evidence about v1.2 performance
  artifact: docs/evidence/P1.12_V1.2_PROJECTED_POWER.json
  basis: cluster bootstrap over the 39 P1.10 isolates, leave-one-isolate-out calls, N = 79
  binding_constraint: PPV, with a complete 12-tool panel
  binding_constraint_note: >
    With a complete panel, recall clears its 0.50 bar by roughly 0.28 while PPV clears its 0.95
    floor by roughly 0.02, so P(PASS) is governed almost entirely by the false-positive rate. A
    sensitivity grid over the false-positive-rate multiplier is recorded rather than a single
    headline number. Tool failure INVERTS this: there recall collapses and becomes binding.
  tool_failure_method: >
    The frozen model is fed the tool as unavailable through apply_neutrality. An earlier version
    zeroed the one-hot block, which is NOT neutral after StandardScaler, and reported
    single_tool_failure P(PASS) 0.977. That figure was wrong and is superseded by the values below.
  scenarios:
    expected: {P_PASS: 0.969, PPV_median: 0.9707, recall_median: 0.7769}
    modest_degradation: {P_PASS: 0.781, PPV_median: 0.9598, recall_median: 0.6988}
    conservative_degradation: {P_PASS: 0.171, PPV_median: 0.9377, recall_median: 0.6212}
    sample_loss_15pct: {P_PASS: 0.775, PPV_median: 0.9599, recall_median: 0.6993}
    single_tool_failure_worst: {P_PASS: 0.000, PPV_median: 0.9625, recall_median: 0.2020,
                                tool: PlaScope}
    single_tool_failure_median: {P_PASS: 0.941, PPV_median: 0.9682, recall_median: 0.6679,
                                 tool: geNomad}
    median_tool_failure_plus_modest: {P_PASS: 0.672, PPV_median: 0.9556, recall_median: 0.6008}
  panel_completeness_precondition: >
    Loss of the single most influential tool drives P(PASS) to 0.000: recall falls to 0.2020, far
    below the 0.50 floor. Panel completeness must therefore be verified BEFORE a P1.11 run is
    considered evaluable. A run with an incomplete panel is not a fair test of the frozen operating
    point and must be reported as such rather than scored as a FAIL.
  scenario_units:
    recall_multiplier: fraction of true positives retained
    fp_rate_multiplier: multiplier on the observed false-positive rate among true negatives (0.00471)
  caveat: >
    These project the frozen decision rule onto a cohort resembling P1.10. P1.11 is a different,
    later, ANI-independent cohort and its sampling distribution is unknown. No number here is
    evidence about v1.2 performance.
