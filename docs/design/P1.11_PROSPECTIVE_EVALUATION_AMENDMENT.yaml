n_target_note: >
  N >= 200 independent isolates was shown to be unreachable: 286 candidates yielded 79 independent
  isolates, and accrual runs at about 6.0 usable isolates per month, so 200 would take roughly 20
  months. N = 79 is Wave 1 of a sequential design, not a compromise on a reachable target.

# ------------------------------------------------------- critical-tool preflight and completeness

critical_tool_gate:
  critical_tools: [PlaScope]
  criticality_basis: >
    Prespecified on development evidence: PlaScope absence takes v1.2-General recall from
    approximately 0.7764 to approximately 0.2013 - below the 0.50 primary floor - while PPV holds.
    A run without PlaScope is therefore not a fair test of the frozen operating point.
    See docs/evidence/P1.12_V1.2_FAILURE_SENSITIVITY.tsv.

  before_any_p1_11_inference:
    - Verify the frozen PlaScope image, executable, database hash and expected command.
    - Run a truth-blind PlaScope smoke test on an ALREADY CONSUMED sample, never a P1.11 isolate.
    - Require valid output, exact contig-ID reconciliation and parser success.
    - Verify the same for the remaining 11 tools as a panel-health preflight.
    - Freeze the resulting preflight receipt BEFORE P1.11 processing begins.
  preflight_blocks_processing: >
    A critical failure in the preflight exits non-zero and blocks P1.11 processing. The acceptance
    criteria were authored and hashed before any P1.11 inference, so they cannot be chosen after
    observing how the tools behave.
  frozen_identities_checked:
    images: >
      13 as-executed image IDs from the P1.10 stage-1 gate. Verified directly, which is stronger
      than hashing Dockerfiles.
    environment: >
      19 files against P1.10_ASEXECUTED_ENV_MANIFEST.json, the AS-EXECUTED baseline. The P1.9C4
      ENV_MANIFEST_prestart.sha256 is a PRESTART snapshot and is NOT used: it predates the
      revisions that produced parser 1.7 and matches neither env tree on disk.
    derived_runner: >
      the P1.11 runner and parser, derived from P1.10 by path and container-prefix substitution
      only, hashed against P1.11_DERIVED_RUNNER_RECEIPT.json with all 13 scientific CMD strings
      proven byte-identical (path-normalised hash 44f8d17d0b406fccae57423c5111cf55).
    parser_version: p19c4-parsers/1.7
    plascope_command: >
      centrifuge -f --threads $THREADS -x /db/plascope/chromosome_plasmid_db -U $FAN -k 1000
      --report-file /out/${S}_summary.tsv -S /out/${S}_extendedresults.tsv
    external_databases: >
      the 6 tools that mount an external database require one; their 9 retained source archives are
      verified against the P1.9C4 DB_RECEIPTS sha256, which is direct evidence of prior identity.
    embedded_databases: >
      the 7 tools whose database is built into the frozen image mount no external database and are
      NOT required to have one. They are verified by image ID plus the retained initialisation or
      install receipt.
    functional_replay: >
      PlaScope re-run on a retained P1.10 input; summary byte-identical, per-read output compared
      as a sorted record set because centrifuge emits records in thread-completion order.
    end_to_end: >
      13/13 tools on a consumed sample and 3636/3636 parsed calls reproducing P1.10 exactly.

  during_p1_11:
    - Record every tool state for every sample.
    - At most 2 retries of a TECHNICAL execution failure, using the identical frozen image,
      database, command and parameters.
    - Do not patch, replace or retune any tool after P1.11 processing begins.
    - Persistent PlaScope failure is a prespecified CRITICAL-PANEL FAILURE.
    - Preserve affected samples and their outputs. Never silently discard or relabel them.
    - Report critical-panel coverage, failure counts and affected contigs INDEPENDENTLY of truth.
    - "PlasmidFinder/FAILED continues to be permitted; that state was observed during training
       and carries a defined learned encoding."
    - Preserve explicit FAILED/MISSING states for all other tools.

  minimum_coverage:
    rule: critical-tool availability for at least 95% of the 79 prespecified isolates
    minimum_isolates: 76
    availability_definition: >
      a tool is AVAILABLE for an isolate when it produced a usable call on at least one contig of
      that isolate. An explicit tool-state table, when supplied, takes precedence over inference
      from the contig table.
    if_not_met: OPERATIONALLY INCONCLUSIVE
    inconclusive_semantics: >
      Neither PASS nor FAIL. The frozen operating point was never fairly tested, so no verdict on
      the model is available. This outcome is reached even when the observed PPV and recall would
      otherwise have met their floors - the gate is evaluated first and is not overridden by a
      favourable result.
    if_met_with_some_failures: >
      Report the PRIMARY complete-critical-panel result, plus a SEPARATE failure-inclusive
      sensitivity analysis over all isolates. The sensitivity analysis is non-gating and never
      replaces the primary.

  verified_gate_behaviour:
    - {coverage: "79/79 = 100.0%", gate: MET, primary: scored, sensitivity: not_applicable}
    - {coverage: "76/79 = 96.2%", gate: MET, primary: scored, sensitivity: reported}
    - {coverage: "71/79 = 89.9%", gate: NOT MET,
       primary: OPERATIONALLY INCONCLUSIVE,
       note: "reached even though PPV and recall both met their floors"}

# ---------------------------------------------------------------------------- analyses

analysis_A_primary_confirmatory:
  gating: true
  model: PlasmidCall v1.2-General
  population: >
    CP2 - all truth-resolved contigs >= 1 kb, restricted to complete-critical-panel isolates
  threshold: 0.9285
  threshold_fixed: true
  pass_rule: "PPV >= 0.95 AND recall > 0.50"
  gate_precondition: >
    The critical-tool completeness gate is evaluated FIRST. If it is not met the verdict is
    OPERATIONALLY INCONCLUSIVE regardless of the observed metrics.
  verdict_wording_if_met: >
    PASS. PlasmidCall v1.2-General met its predeclared primary endpoint on an independent,
    ANI-screened, temporally separated cohort of 79 isolates: PPV >= 0.95 and recall > 0.50 on all
    truth-resolved contigs >= 1 kb at the frozen threshold 0.9285. The model is designated
    VALIDATED BETA for the general (non-core-ARG) domain.
  verdict_wording_if_not_met: >
    FAIL. PlasmidCall v1.2-General did not meet its predeclared primary endpoint. The observed PPV
    and recall are reported as measured. The model remains a DEVELOPMENT CANDIDATE and must not be
    described as validated. No threshold may be re-selected to recover a PASS; the frozen operating
    point is the claim that was tested.
  partial_outcome_rule: >
    Both conditions must hold. Meeting one and missing the other is a FAIL, reported with both
    numbers and with which condition failed named explicitly.
  verdict_wording_if_gate_not_met: >
    OPERATIONALLY INCONCLUSIVE. Critical-tool coverage fell below 95% of the 79 prespecified
    isolates, so the frozen operating point was not fairly tested. This is neither a PASS nor a
    FAIL: no verdict on PlasmidCall v1.2-General is available from this run. The observed metrics,
    the critical-panel coverage, the failure counts and the affected contigs are all reported. The
    model remains a DEVELOPMENT CANDIDATE. No threshold may be re-selected, and the run may not be
    rescored by relaxing the gate.

analysis_A2_failure_inclusive_sensitivity:
  gating: false
  trigger: reported whenever any critical-tool failure occurred
  population: CP2 including critical-tool-failed isolates
  purpose: >
    Shows what the frozen operating point would have produced had the incomplete-panel isolates
    been scored. Non-gating, and never a substitute for the primary: those isolates were scored on
    a panel the operating point was not characterised for.

analysis_B_key_secondary:
  gating: false
  model: PlasmidCall v1.1
  population: CP1 - truth-resolved core-ARG-bearing contigs >= 1 kb
  thresholds: [0.9524, 0.9605]
  reporting: as observed, whatever the result
  power_caveat: >
    CP1 is structurally unpowerable at this cohort size. The recall margin at the v1.1 operating
    point is +0.0048, giving P(PASS) 0.403 at N=39 and only 0.565 at N=400. A CP1 result here is
    descriptive. It does not confirm or refute v1.1 and does not gate anything.

analysis_C_routed_deployment:
  gating: false
  system: the two-domain router with explicit abstention
  routing_rule: >
    core_arg_present -> v1.1; core_arg_absent -> v1.2-General;
    annotation_failed or annotation_missing -> routing_abstain
  strata: [overall, CP1_arg_bearing, CP2_non_arg, length_1-10kb, length_10-50kb, "length_>=50kb",
           circular, linear, gfa_isolated_deg0, "gfa_connected_deg>0", routing_abstain]
  metrics: [n, n_plasmid, TP, FP, TN, FN, PPV, recall, specificity, n_routed_v1.1, n_routed_v1.2,
            n_routing_abstain]
  abstain_handling: >
    Abstained contigs are EXCLUDED from every routed stratum and reported as a separate count. No
    PPV or recall is emitted for them: they carry no routed class, so those metrics are undefined by
    construction and must never be imputed. Router coverage reports the abstain fraction explicitly.
  cp1_membership: >
    CP1 membership requires a SUCCESSFUL annotation. A contig whose annotation failed cannot be
    assigned to CP1 and is excluded from analysis B, with the excluded count reported.
  score_pooling: FORBIDDEN

# ---------------------------------------------------------------------------- discipline

locked_conditions:
  no_refitting: true
  no_recalibration: true
  no_threshold_search: true
  no_additional_comparators: >
    Comparators are locked to those named here and are evaluated without refitting.
  no_post_hoc_population: >
    CP1 and CP2 are defined by the existing frozen rules. No new population may be defined after
    outcomes are seen.
  deviation_policy: >
    Any deviation from the locked evaluator invalidates the confirmatory claim. If a defect in the
    evaluator is discovered after P1.11 outcomes are known, the corrected result is reported AS A
    DEVIATION alongside the original; the original stands in the record.

hash_receipt_before_join:
  requirement: >
    The SHA-256 of the locked evaluator and of the frozen estimator must be recorded BEFORE P1.11
    truth is joined to P1.11 predictions, and re-verified at reporting time.
