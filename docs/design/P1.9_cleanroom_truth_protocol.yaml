protocol: P1.9 clean-room benchmark construction and truth assignment
version: 1.0-FROZEN-BEFORE-EXECUTION
status: PROPOSED — OWNER APPROVAL REQUIRED. Nothing acquired, assembled, aligned or labelled.
date: 2026-08-17

# ============================================================ clean-room boundary
cleanroom_boundary:
  rationale: >
    The plasgraph2 repository carries no licence, so its derived artifacts may not be reused.
    The underlying data are public GenBank/SRA records and the labelling method is published,
    so an independent reconstruction is lawful and, being independently derived, is a stronger
    external benchmark than a copied one.
  PROHIBITED_INPUTS:
    - plasgraph2 repository GFA files (*.gfa.gz)
    - plasgraph2 repository label CSVs (*.gfa.csv)
    - any derived alignment or coverage table from that repository
    - any file copied from it into this project
  PERMITTED_INPUTS_AFTER_APPROVAL:
    - public NCBI/ENA short reads by accession
    - public NCBI/ENA long reads by accession
    - public assemblies and closed chromosome/plasmid references
    - the scientific method as described in the published paper
    - assemblies, graphs, alignments and labels generated by our own independently written code
  permitted_metadata_use: >
    The accession list itself is factual metadata verified against NCBI. It is used as a
    pointer list; every accession is dereferenced from the public archive, not trusted from
    the repository file.

# ============================================================ assembler selection
assemblers:
  PRIMARY: Unicycler
  PRIMARY_version: pin at execution; record exact version and container digest
  SENSITIVITY: SKESA
  SENSITIVITY_version: pin at execution
  selection_justification:
    gfa_retention: >
      Unicycler emits a GFA assembly graph as a first-class output; SKESA also emits GFA.
      Both satisfy the hard requirement that a graph exists.
    coverage_representation: >
      Unicycler writes a normalised depth tag (dp) per segment. gplasCC's coverage model
      consumes exactly this. SKESA writes a k-mer count (KC) that must be divided by segment
      length and renormalised — usable, but a transformation step away.
    reproducibility: >
      Both are deterministic given fixed inputs and version. Determinism is verified by
      assembling one sample twice and comparing GFA hashes before the full run.
    gplascc_compatibility: >
      P1.8B established gplasCC performance on Unicycler-derived graphs. Keeping the primary
      assembler the same removes graph representation as a confounder between our two
      evaluations.
    short_read_suitability: >
      Both are designed for short-read bacterial assembly. Unicycler is a SPAdes-based
      pipeline tuned for bacterial isolates; SKESA is conservative and produces less
      mis-assembly at the cost of contiguity — a genuinely different failure profile, which
      is what makes it a useful sensitivity arm rather than a near-duplicate.
  selection_is_prospective: true
  assembler_outputs_are_not_independent_isolates: true

# ============================================================ frozen parameters
frozen_before_execution:
  assembler_and_version: Unicycler <pin>; SKESA <pin>
  read_preprocessing:
    adapter_and_quality_trimming: fastp <pin>, default adapter detection
    min_read_length: 50
    deduplication: none
    subsampling: none
  graph_generation: assembler-native GFA; no post-hoc graph editing
  aligner_and_version: minimap2 <pin>, preset asm5 for contig-to-replicon
  identity_threshold: 0.95
  query_coverage_threshold: 0.80        # fraction of CONTIG length, merged non-overlapping
  interval_merging: merge overlapping alignment intervals on the contig before computing
    covered fraction; never sum overlapping intervals
  competitive_mapping: >
    each contig is aligned against a single competitive reference built from THAT sample's own
    closed chromosome(s) and plasmid(s); assignment goes to the replicon class with the higher
    merged covered fraction
  multi_mapping_rule: >
    if |chromosome_fraction - plasmid_fraction| < 0.10, label ambiguous_shared
  repeat_rule: >
    a contig aligning above threshold at more than one location is flagged repeat with its
    multiplicity retained; never deduplicated away
  minimum_contig_length: 1000        # reported separately from all other exclusions
  tie_handling: ambiguous_shared, never an arbitrary pick
  circular_replicon_handling: >
    double the reference or use a circular-aware alignment so contigs spanning the artificial
    origin are not truncated; record which method was used
  integrated_element_handling: >
    plasmid-derived sequence integrated in the chromosome is chromosomal IN THIS ISOLATE and
    is labelled mobile_plasmid_like_chromosomal, never plasmid
  evalue_threshold: MUST BE SET AND RECORDED — the upstream PlasEval truth code left this
    undocumented and that omission is deliberately not repeated
  failure_handling: >
    a sample whose assembly, alignment or reference retrieval fails is retained with status
    unmapped_failed and reported; it is never silently dropped from the denominator

# ============================================================ required outputs per sample
required_outputs:
  - short_read_assembly_fasta
  - assembly_gfa
  - coverage_fields            # extracted from dp/KC and normalised, method recorded
  - hybrid_or_closed_reference_manifest
  - chromosome_replicon_manifest
  - plasmid_replicon_manifest
  - competitive_alignment_table
  - final_truth_table
  - ambiguity_table
  - run_receipt                # via the local runner: exact command, image, PID, timings
  - hashes                     # SHA-256 of every input and output

# ============================================================ truth labels
truth_labels:
  - plasmid
  - chromosome
  - mobile_plasmid_like_chromosomal
  - ambiguous_shared
  - unmapped_failed
prohibited:
  - forcing repeat-shared contigs into a binary label
  - treating unmapped as chromosome
  - treating absence from the plasmid set as chromosome
  - merging ambiguous_shared into either binary class

# ============================================================ per-contig record
contig_record_fields:
  - sample
  - assembler
  - contig_id
  - contig_length
  - coverage
  - chromosome_aligned_fraction
  - plasmid_aligned_fraction
  - unresolved_or_shared_fraction
  - best_chromosome_hit
  - best_plasmid_hit
  - competing_hit_count
  - final_truth_label
  - decision_reason            # which frozen rule fired
  - confidence_state           # high | margin | ambiguous | failed
  - source_hashes              # assembly, reference, alignment file SHA-256

# ============================================================ execution
execution:
  runner: scripts/local-run (detached, parallel, restart-safe)
  slot_id_convention: <sample_id>__<assembler>__rep<replicate>
  determinism_check: assemble one sample twice; GFA hashes must match before the full run
  stop_conditions:
    - assembler non-determinism detected
    - closed reference unavailable for a sample (that sample becomes unmapped_failed)
    - more than 10% of samples fail assembly
    - a frozen parameter would have to change after results are seen
