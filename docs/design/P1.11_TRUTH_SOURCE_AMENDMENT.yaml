# ---------------------------------------------------------------------------- decision

decision: >
  For an isolate with no RefSeq path in the SEALED cohort record, fall back to the GenBank (GCA)
  path from that same sealed record. RefSeq remains the preferred source and is used wherever
  present: 64 of 79 isolates resolve through RefSeq, 15 through GenBank.

rationale:
  - All 15 are Complete Genome assemblies, the same assembly level the pipeline already requires.
  - >-
    Both sources provide the three artefact types required by the frozen truth pipeline and the
    metadata fields consumed by it, but they differ in curation status. The artefacts are
    _genomic.fna.gz (replicon sequences), _assembly_report.txt (authoritative
    Assigned-Molecule-Location/Type, from which replicon roles are read) and _genomic.gbff.gz
    (LOCUS topology). Availability of the required fields is not a claim of equivalent curation.
  - >-
    Both paths come from the SEALED cohort record, which was fixed before panel inference began.
    Nothing is re-resolved from NCBI after predictions exist. The REFERENCE IDENTITY therefore
    predates inference. This is a statement about the sealed reference identity, not about this
    amendment: the amendment itself was issued after panel inference began and before truth
    acquisition (see position_in_execution_timeline).
  - Every file is still verified against NCBI's own md5checksums.txt for that assembly directory.

rejected_alternatives:
  - option: re-resolve RefSeq accessions live from NCBI now
    rejected_because: >
      truth would then depend on a lookup performed AFTER predictions exist, which is weaker
      provenance than the sealed record.
  - option: evaluate only the 64 RefSeq isolates
    rejected_because: >
      that silently shrinks a sealed cohort from 79 to 64 and reduces power below the plan. Cohort
      membership may not be changed to work around a data-availability gap.

# ---------------------------------------------------------------------------- what changes

changed:
  - acquire_truth.py resolves ftppath_refseq, and falls back to ftppath_genbank when that column is
    empty for an isolate.
  - the per-isolate acquisition receipt records which source was used (refseq or genbank), so every
    truth call is traceable to its reference origin.
  - the cohort assertion changes from 39 to 79 isolates.
  - the cohort file is the sealed P1.11 cohort.

explicitly_unchanged:
  - "truth mapping thresholds: identity 0.95, merged coverage 0.80, margin 0.10, min length 1000"
  - circular doubling and modulo folding
  - the merged-interval coverage assertion (<= 1.0)
  - the ratified mobile_plasmid_like_chromosomal secondary-flag rule
  - minimap2 2.28-r1209 inside p19c2-cleanroom:1.0
  - replicon roles read from the authoritative NCBI assembly report
  - topology read from the GBFF LOCUS line
  - the refusal to acquire truth while predictions are unfrozen
  - truth_hold/ mode 700, never mounted by any inference container
  - cohort membership: all 79 sealed isolates
  - >-
    the estimator, and every threshold with its version-scoped role: v1.2-General standard 0.9285;
    v1.1 standard 0.9524 with the 0.9605 high-confidence tier; v1.0 preregistered standard 0.9605
    with the 0.9776 very-high-confidence tier, the latter retired as a class boundary under v1.1 and
    used nowhere in P1.11
  - every evaluation rule, endpoint definition and scoring rule

# ---------------------------------------------------------------------------- reporting

reporting_requirement:
  preamble: >-
    The final evidence record must state how many isolates used each reference source, and must
    allow a reader to see for themselves whether the fallback influenced the outcome. The primary
    analysis remains over all isolates that pass the completeness gate. None of the items below may
    be produced before truth is acquired.
  required_items:
    - id: 1
      item: primary results across all truth-resolved eligible isolates
      gating: true
    - id: 2
      item: RefSeq-only sensitivity results (the 64 isolates)
      gating: false
    - id: 3
      item: GenBank-only descriptive results (the 15 isolates)
      gating: false
      note: descriptive only - 15 isolates cannot support an inferential claim
    - id: 4
      item: ambiguous / unresolved contig counts, broken down by reference source
      gating: false
    - id: 5
      item: plasmid prevalence and contig-length distribution, by reference source
      gating: false
    - id: 6
      item: parsing or completeness failures by source, if any
      gating: false
      note: reported as zero if none occurred, never omitted
  interpretation_guard: >-
    A difference between the RefSeq-only and GenBank-only views is not by itself evidence that the
    reference source caused it: the two groups are not matched on species, submitter, assembly date
    or plasmid content. The breakdown exists so that a source effect cannot hide, not so that one
    can be asserted from 15 isolates.
  no_results_before_truth: >-
    None of these views may be computed, drafted or estimated before truth acquisition. Producing
    them early would place truth-derived quantities on the host before the prediction freeze.

limitation: >
  RefSeq applies curation that GenBank does not. For 15 of 79 isolates (19%) the truth reference is
  therefore a GenBank assembly rather than a RefSeq one. Both sources provide the three artefact
  types required by the frozen truth pipeline and the metadata fields consumed by it, and all 15 are
  Complete Genome assemblies - but availability of the required fields is not equivalence of
  curation. This is a real heterogeneity in truth provenance and is recorded as such rather than
  smoothed over. The six-part breakdown in reporting_requirement exists so that its effect, if any,
  is visible rather than assumed absent.

