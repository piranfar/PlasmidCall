# ---------------------------------------------------------------------------- the situation

problem: >
  The frozen truth pipeline resolves each isolate's own complete reference genome from the
  ftppath_refseq column of the sealed cohort. Truth is derived entirely from that reference, so a
  missing path is not a cosmetic gap - the isolate cannot be scored at all.

measured:
  n_isolates: 79
  with_refseq_path: 64
  with_genbank_path_only: 15
  with_neither: 0
  all_15_assembly_level: Complete Genome

why_p1_10_never_hit_this: >
  All 39 P1.10 isolates carried a RefSeq (GCF) path, so the frozen acquire_truth.py has no fallback
  and would simply fail on 15 of the 79.

