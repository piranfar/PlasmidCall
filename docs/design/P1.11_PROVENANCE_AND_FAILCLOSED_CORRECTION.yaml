# =============================================================================================
# P1.11 PROSPECTIVE CORRECTION - cohort provenance and fail-closed evaluation
# =============================================================================================
amendment_id: P1.11_PROVENANCE_AND_FAILCLOSED_CORRECTION
version: "1.0"
status: SUPERSEDING - prospective correction, issued before any P1.11 outcome exists
declared_on: 2026-08-22
authorisation: >-
  Owner, 2026-08-22: "Approve a single prospective P1.11 correction amendment covering provenance
  and fail-closed evaluation defects B and C. Proceed without stopping, restarting, modifying, or
  otherwise disturbing the running 12-tool panel."

# ---------------------------------------------------------------------------- timing

position_in_execution_timeline:
  issued_after: panel inference began
  issued_before:
    - prediction freeze
    - truth acquisition
    - truth mapping
    - truth joining
    - outcome scoring
  verified_at_issue:
    PREDICTIONS_FROZEN_json: ABSENT
    p112_truth_hold: ABSENT
    p112_assembly_report_files: 0
    p112_gbff_files: 0
    p112_paf_or_mapping_files: 0
    p112_contig_level_truth_tables: 0
    p111_cohort_isolates_with_any_truth_artefact: 0 of 79
  statement: >-
    This correction was issued while the 12-tool panel was still executing and before any P1.11
    truth existed in any form. No P1.11 outcome, metric, PPV or recall value had been generated or
    inspected by anyone at the time these decisions were locked.

raw_panel_inference_is_unaffected: >-
  Nothing in this amendment touches the panel. No tool was stopped, restarted, re-run or
  reconfigured; no tool output was read, rewritten or deleted; no image, database, command,
  parameter, CPU limit, memory limit or retry rule was altered. The correction operates strictly
  downstream of tool execution, on cohort provenance and on the evaluation code path.

# ---------------------------------------------------------------------------- why fail-closed

estimand_note:
  # SUPERSEDED 2026-08-22 by docs/plans/P1.11_SELECTIVE_CLASSIFICATION_ADDENDUM.yaml.
  # An earlier draft of this block analysed the exclusion of abstained rows as a directional
  # "effect" on PPV and recall that required defending. That framing is withdrawn. PlasmidCall is
  # evaluated as a SELECTIVE CLASSIFIER, and selective_PPV / selective_recall over score-evaluable
  # rows are the DECLARED ESTIMAND - not an adjustment to some other quantity. Rows carrying no
  # classification are outside the denominators by construction.
  framework: selective classification
  declared_estimand: >-
    selective_PPV = TP/(TP+FP) and selective_recall = TP/(TP+FN), with TP/FP/TN/FN defined only
    among score-evaluable, truth-eligible contigs.
  governed_by: docs/plans/P1.11_SELECTIVE_CLASSIFICATION_ADDENDUM.yaml
  paired_safeguard: >-
    because a selective classifier could otherwise meet a target by declining to predict, coverage
    and abstention are co-reported with every metric and are subject to a separately frozen
    coverage gate. That gate - not a claim about directionality - is what prevents abstention from
    purchasing precision.
  decision_D_note: >-
    the allowlist form of ann_ok is deliberately stricter than the previous blocklist: an
    unrecognised annotation state now abstains or errors rather than being read as success.

why_this_correction_could_not_be_tuned_to_a_result: >-
  The safeguard is timing and disclosure, not impossibility. P1.11 truth has not been acquired, constructed, or accessed by the evaluation workflow. It has not been
  acquired, mapped, joined or scored by that workflow. This is a statement about what the P1.11
  prediction workflow consumed, not a claim that no reference-related file can exist anywhere on
  the host. No P1.11 PPV or recall value exists, none has been computed,
  and none was inspected by anyone before these decisions were fixed and hashed. There was
  therefore no observed outcome to tune toward, and the direction any correction happens to push a
  future metric could not have been known when it was chosen. Every effect above is reported with
  its own denominator so a reader can subtract it. The PASS rule, thresholds, endpoints,
  populations and bootstrap seed are untouched.

# ---------------------------------------------------------------------------- the defects

defects:
  - id: B1
    title: truth acquisition read a cohort file that is not the predeclared sealed cohort
    discovered_how: >-
      An adversarial documentation-verification agent, re-deriving threshold provenance, noticed
      that the cohort named in the truth-source amendment (P1.11_cohort_independent.tsv, 23
      columns) is not the file the P1.11 predeclaration seals (P1.11_cohort_sealed.tsv, 25
      columns, sha256 0d0e547c...) and whose hash the pre-join receipt re-verifies as INTACT.
    affected_files:
      - /data/trace-arg/p112/env/run/acquire_truth.py (interim derivation, COH pointed at the
        non-predeclared file)
      - docs/plans/P1.11_TRUTH_SOURCE_AMENDMENT.yaml (recorded that file as "sealed_cohort")
    measured: >-
      The two files agree on every field any consumer reads - same 79 BioSamples in identical row
      order, 0 assembly-accession mismatches, 0 RefSeq-path mismatches, 0 GenBank-path mismatches,
      identical 64/15 source split, and 0 mismatches across all 15 shared columns. The defect is
      PROVENANCE, not content - see docs/evidence/P1.11_COHORT_PROVENANCE_DISCREPANCY.json.
    why_it_matters: >-
      The hash the pre-join receipt certifies would have belonged to a file truth acquisition never
      opened. Matching values today do not make a non-predeclared file canonical, and a future
      divergence would have gone undetected.

  - id: C1
    title: an unavailable model score was silently converted into a negative prediction
    discovered_how: >-
      A code-reading verification agent traced numeric() -> np.nan -> `v11 >= V11_THRESHOLD` and
      demonstrated by execution that NaN compares False. Confirmed independently:
      input [nan, 0.9524, 0.9605, 0.90] yielded calls [0, 1, 1, 0].
    affected_files:
      - scripts/p1_12/evaluate_p111_locked.py (numeric(), c11, c11h, analysis B, analysis C)
    why_it_matters: >-
      A missing score and a genuinely low score became indistinguishable. Both counted as
      not-selected and entered the confusion matrix as negatives, which silently inflates the
      denominator for recall and contradicts the programme rule that unavailable evidence is never
      converted into a negative call.

  - id: D1
    title: annotation_state defaulted to "ok", disabling routing abstention entirely
    discovered_how: >-
      The same agent found `r.get("annotation_state", "ok")` and observed that the column is absent
      from the upstream contig table, so every contig would read as successfully annotated and
      n_routing_abstain would always be 0, with no warning.
    affected_files:
      - scripts/p1_12/evaluate_p111_locked.py (ann_ok, analysis B, analysis C, per-contig output)
    why_it_matters: >-
      It infers "no core ARG" from unavailable annotation. That is precisely the inference the
      router correction of 2026-08-20 was created to forbid, reintroduced through a default value.

  - id: B2
    title: the pre-join receipt pins the SUPERSEDED preflight
    discovered_how: audit of the predeclaration's hash_receipt block against locked_preflight
    affected_files:
      - docs/plans/P1.11_PROSPECTIVE_EVALUATION_AMENDMENT.yaml (hash_receipt block,
        preflight_sha256 = edba943f..., the retired implementation)
      - docs/evidence/P1.12_PRE_JOIN_HASH_RECEIPT.md (same stale pin)
      - scripts/p1_12/router_fixtures.py (imported the superseded module)
    why_it_matters: >-
      The gate that must be satisfied before truth is joined would certify a file the programme
      had already retired for three execution-verification defects.

  - id: B3
    title: pinned hashes are non-reproducible CRLF working-copy values
    discovered_how: >-
      While re-deriving the evaluator, its on-disk hash (a3fd1324...) did not match the value git
      stores. Investigation showed the file is CRLF in the worktree while .gitattributes declares
      *.py text eol=lf, so the committed content hashes 8ca7b0d6...
    measured: 9 of 19 pinned dependencies carry a CRLF working-copy hash
    affected_files:
      - scripts/p1_12/evaluate_p111_locked.py, panel_preflight_p111_v2.py, freeze_v12.py,
        evidence_v12.py, emit_dictionary.py, router_fixtures.py
      - models/plasmidcall_v1.2-general/P1.12_V1.2_{ENCODING_SPEC,MODEL_PORTABLE,TRAINING_RECEIPT}.json
    why_it_matters: >-
      This is exactly the failure docs/HASH_AND_LINE_ENDING_POLICY.md was written to prevent: a
      hash mismatch that means "the checkout rules differ" rather than "the bytes changed". The
      pre-join gate would fail on 9 entries from a fresh checkout. NO FILE CONTENT DIFFERS -
      git diff is empty. It is a recording defect, not corruption.

# ---------------------------------------------------------------------------- decisions

decision_A_canonical_cohort:
  ruling: >-
    P1.11_cohort_sealed.tsv, sha256 0d0e547cd6f6546ac6f72e516885a74cf51dd3738be83b0a45f58cfbe999151f,
    remains the SOLE canonical cohort. P1.11_cohort_independent.tsv is NOT adopted as a
    replacement, and the fact that its values currently match is explicitly not a reason to adopt
    it.
  transfer:
    procedure: scp over the project's existing key-based channel, hash-verified after arrival
    host_path: /data/trace-arg/p111/manifests/P1.11_cohort_sealed.tsv
    sha256_after_transfer: 0d0e547cd6f6546ac6f72e516885a74cf51dd3738be83b0a45f58cfbe999151f
    matches_predeclared: true
    bytes: 53696
    data_rows: 79
    columns: 25
    set_read_only: true
    existing_files_overwritten: none
  script:
    original_preserved: /data/trace-arg/p112/env/run/acquire_truth.v1-interim.superseded.py
    original_sha256: 181e69b3d1d9fe08d4cf05ec6643c2679b7d6f6afe91d3d411d4002939b07b68
    corrected: /data/trace-arg/p112/env/run/acquire_truth_v2.py
    corrected_sha256: d67b0959a4c2e31fa17e96361e826987797877441f90622981dc271c2d97f166
    corrected_sha256_at_first_derivation: 6df0b4043909ee0377b084e8973aecad7a32d0129627470c7978cefc434572eb
    post_verification_fixes: >-
      the stale P1.10 docstring (which still said 39 isolates and RefSeq-only, contradicting the
      code) was rewritten, and the bare `assert len(rows) == 79` was replaced with an explicit
