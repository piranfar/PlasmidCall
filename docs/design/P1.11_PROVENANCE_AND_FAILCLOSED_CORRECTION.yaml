decision_C_missing_model_scores:
  rule: >-
    A missing, absent, empty, non-numeric, infinite or NaN model score is NEVER converted to a
    negative prediction.
  implementation: scripts/p1_12/evaluate_p111_locked_v2.py
  mechanism:
    - score_available() validates the raw cell BEFORE any comparison is made
    - classify_with_abstain() emits -1 for unavailable rows instead of thresholding NaN
    - unavailable rows are labelled model_abstain and excluded from that model's TP/FP/TN/FN
    - a valid BELOW-threshold score remains a genuine negative and stays in the matrix
    - counts and denominators are reported separately in B_key_secondary.denominators and in
      score_availability
    - rows are retained in the failure-inclusive sensitivity view and never silently dropped
    - per-contig output records v11_score_state and v12_score_state
  audited_for_both_models: true
  denominator_handling_defined_before_truth_access: >-
    analysis B reports n_CP1_after_annotation_filter, n_scored and n_model_abstain_v1_1. Metrics
    use n_scored. This is fixed here, before any truth exists.

decision_D_annotation_state_and_router:
  rule: >-
    The evaluator must not use r.get("annotation_state", "ok") or any equivalent permissive
    default.
  implementation: scripts/p1_12/evaluate_p111_locked_v2.py
  mechanism:
    - annotation_state is REQUIRED in the input schema; a missing COLUMN is a hard error naming the
      column and the required upstream fix
    - an EMPTY value is a hard error; empty means unrecorded, not ok
    - the vocabulary is validated; an unrecognised value is a hard error and is never coerced to ok
    - per-row failed / missing / unavailable annotation routes to routing_abstain
    - a contig is never inferred to be free of core ARGs on the basis of unavailable annotation
    - unavailable annotation is never routed to v1.1 or v1.2
    - routing-abstention counts are reported explicitly and are observable in the per-contig output
  vocabulary:
    ok_states: [ok, annotated, success, succeeded]
    unavailable_states: [annotation_failed, annotation_missing, failed, missing, unavailable, error]

  # ------------------------------------------------------------------ REQUIRED UPSTREAM CORRECTION
  upstream_status: BLOCKING_UNTIL_IMPLEMENTED
  upstream_finding: >-
    The upstream contig table CANNOT currently represent annotation failure. Inspected the actual
    P1.10 contig table (the structural precedent, 56 columns, 10,332 rows): it has no
    annotation_state column, and ARG_bearing / ARG_bearing_bool are strictly boolean with exactly
    two distinct values and zero empty cells. There is no third state. parse_all.py, which produces
    the P1.11 call table, contains zero references to ARG annotation. The P1.11 contig-table
    builder does not exist yet on the execution host.
  required_upstream_correction: >-
    Before predictions are frozen, the P1.11 contig-table builder MUST emit a per-contig
    annotation_state column drawn from the amrfinder per-sample run state, which the panel already
    records at inference/state/amrfinder__<sample>.done|.failed. A sample whose amrfinder run
    failed must yield annotation_failed for every contig of that sample; a sample with no amrfinder
    marker at all must yield annotation_missing. ARG_bearing_bool must not be emitted as False for
    such a sample.
  why_this_is_not_a_retrofit: >-
    The P1.11 contig table has not been built. Specifying the column now is prospective, not a
    change to existing data.
  consequence_if_not_implemented: >-
    evaluate_p111_locked_v2.py will refuse to run, by design. That is the intended fail-closed
    behaviour: an evaluation that cannot distinguish "annotated, no core ARG" from "annotation
    unavailable" must not silently produce a verdict.

known_latent_issue_not_corrected_here:
  file: scripts/p1_12/plasmidcall_router.py
  issue: >-
    classify_v11 and classify_v12 guard only `score is None`, then compare with a bare >=. A NaN
    reaching either would return not_selected - the same defect class as C1.
  why_not_corrected: >-
    the router is a hash-pinned frozen artefact, and the path is UNREACHABLE from the corrected
    evaluator: evaluate_p111_locked_v2.py calls RT.classify_v11 / RT.classify_v12 only inside an
    `if v11_avail[i]` / `if v12_avail[i]` guard, so an unavailable score never reaches them. It is
    recorded here rather than silently fixed, because changing a pinned artefact to close an
    unreachable path would cost real provenance for no behavioural gain.
  reachable_from_v2_evaluator: false

