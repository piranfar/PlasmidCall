basis:
  attempt_2_classification: OPERATOR_EMERGENCY_STOP
  attempt_2_cause: 'host memory pressure from cgroup-charged file-page cache'
  attempt_2_peak_cgroup_total_gb: 18.291
  attempt_2_peak_swap_gb: 0.001
  attempt_2_spades_cap_honoured: true
  attempt_2_spades_invocations_with_m_12: 6
  attempt_2_spades_invocations_with_m_1024: 0
  mechanism: 'cgroup v2 charges file page cache to the cgroup, so SPAdes scratch I/O was counted on top of its 12 GB resident memory; nothing in the previous profile bounded it'
  evidence: 'memory.current oscillated 14.18 to 3.90 to 6.71 GB, the signature of reclaimable cache; swap was effectively unused despite 8 GB being available'

resource_changes:
  wsl_memory: {from: 22GB, to: 18GB}
  wsl_swap: {from: 12GB, to: 12GB, unchanged: true, location: 'E:\\AMR_Evidence_Data\\wsl_swap.vhdx'}
  wsl_processors: {from: 8, to: 8, unchanged: true}
  container_memory: {from: 20g, to: 14g}
  container_memory_swap: {from: 28g, to: 22g}
  container_cpus: {from: 8, to: 8, unchanged: true}
  sparseVhd: NOT_SET
  experimental_settings: NONE
  docker_compaction_or_prune: NONE
  rationale: 'a 14 GB cgroup ceiling forces the kernel to reclaim file cache at 14 GB instead of letting it grow to 18 GB, while still leaving 2 GB of headroom above the 12 GB SPAdes resident cap; an 18 GB VM guarantees Windows retains roughly 13 GB'

