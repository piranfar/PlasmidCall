monitoring:
  cgroup_v2_counters: [memory.current, memory.peak, memory.swap.current, memory.swap.peak, memory.events]
  cgroup_v2_memory_stat_fields: [anon, file, file_dirty, file_writeback, inactive_file, active_file, kernel, slab]
  rationale: 'anonymous demand must be separable from reclaimable file-page cache'
  host_and_storage: [windows_available_memory, vm_memory, vm_swap, e_free_gb, vhdx_bytes, container_state, stage, log_freshness]
  interval_seconds: 30
  hard_timeout_hours: 14

emergency_rules:
  windows_available_floor_gb: 1.5
  windows_floor_consecutive_observations_required: 2
  single_transient_observation_is_recorded_not_fatal: true
  docker_unhealthy: abort
  e_free_floor_gb: 10
  oom_kill_threshold: 'memory.events oom_kill greater than 0'
  memory_swap_limit_reached: abort
  no_progress_timeout: abort

mandatory_stop: 'STOP after SAMD00056131 whether successful or not; the remaining seven hybrids require explicit approval.'

launch_command_verbatim: |
  docker run --rm --memory=14g --memory-swap=22g --cpus=8 -v "E:\AMR_Evidence_Data\P1.9_cleanroom:/work" p19c2-cleanroom:1.0 bash -c "set -e; unicycler -1 /work/raw/robertson-benchmark_ecol-SAMD00056131/DRR065947_1.fastq.gz -2 /work/raw/robertson-benchmark_ecol-SAMD00056131/DRR065947_2.fastq.gz -l /work/raw_normalized/robertson-benchmark_ecol-SAMD00056131/DRR065950_subreads.norm100x.fastq.gz -o /tmp/h -t 8 --keep 1 --spades_options '-m 12'; mkdir -p /work/assemblies/hybrid/robertson-benchmark_ecol-SAMD00056131; du -sb /tmp/h | cut -f1 > /work/assemblies/hybrid/robertson-benchmark_ecol-SAMD00056131/scratch_bytes.txt; cp /tmp/h/assembly.fasta /work/assemblies/hybrid/robertson-benchmark_ecol-SAMD00056131/hybrid.fasta; cp /tmp/h/assembly.gfa /work/assemblies/hybrid/robertson-benchmark_ecol-SAMD00056131/hybrid.gfa; cp /tmp/h/unicycler.log /work/assemblies/hybrid/robertson-benchmark_ecol-SAMD00056131/unicycler_hybrid.log; a=$(md5sum /tmp/h/assembly.fasta | cut -d' ' -f1); b=$(md5sum /work/assemblies/hybrid/robertson-benchmark_ecol-SAMD00056131/hybrid.fasta | cut -d' ' -f1); c=$(md5sum /tmp/h/assembly.gfa | cut -d' ' -f1); d=$(md5sum /work/assemblies/hybrid/robertson-benchmark_ecol-SAMD00056131/hybrid.gfa | cut -d' ' -f1); test $a = $b; test $c = $d; echo VERIFIED_BEFORE_SCRATCH_DELETE fasta=$a gfa=$c > /work/assemblies/hybrid/robertson-benchmark_ecol-SAMD00056131/copy_verification.txt; rm -rf /tmp/h; echo SCRATCH_REMOVED_AFTER_VERIFY"
